
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DARKNESS: SON GECE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:white;font-family:Arial;overflow:hidden}
#game{width:100vw;height:100dvh;position:relative;background:#000}
canvas{display:block;width:100%;height:100%}
#menu,#ending{
 position:absolute;inset:0;z-index:5;
 background:radial-gradient(circle,#25212a,#050508 75%);
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;
}
h1{font-size:clamp(38px,9vw,75px);letter-spacing:7px;color:#c21e2c;text-shadow:0 0 25px red}
h2{color:#c21e2c;letter-spacing:4px}
button{
 background:#76121c;color:white;border:1px solid #d33;
 padding:14px 22px;margin:6px;border-radius:5px;
 font-size:15px;cursor:pointer
}
button:active{background:#b22}
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
#objective{position:absolute;top:15px;left:15px;background:#0009;padding:12px;font-size:13px}
#hint{position:absolute;top:65px;left:15px;color:#ddd;font-size:13px}
#crosshair{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);font-size:22px;color:white
}
#interact{
 position:absolute;bottom:25px;right:25px;
 pointer-events:auto;display:none
}
#controls{
 position:absolute;bottom:20px;left:20px;
 display:none;pointer-events:auto
}
#controls button{width:55px;height:55px;padding:5px;background:#222b}
#lookInfo{
 position:absolute;bottom:12px;left:50%;
 transform:translateX(-50%);font-size:11px;color:#aaa;
 white-space:nowrap
}
#ending{display:none}
.hidden{display:none!important}
@media(orientation:landscape){
 #controls{bottom:15px;left:20px}
 #interact{bottom:20px;right:25px}
}
</style>
</head>
<body>
<div id="game">

<div id="menu">
 <h1>DARKNESS</h1>
 <h2>SON GECE</h2>
 <p style="color:#aaa">BU MALİKANEDE YALNIZ DEĞİLSİN...</p>
 <button onclick="startGame()">OYUNA BAŞLA</button>
 <p style="color:#777;font-size:12px">WASD: HAREKET | FARE: BAKIŞ</p>
</div>

<div id="hud" class="hidden">
 <div id="objective">GÖREV: Malikane anahtarını bul.</div>
 <div id="hint">Etrafı araştır...</div>
 <div id="crosshair">+</div>
 <button id="interact" onclick="interact()">ETKİLEŞİM</button>

 <div id="controls">
  <div style="text-align:center">
   <button ontouchstart="moveTouch('forward',true)" ontouchend="moveTouch('forward',false)">▲</button>
  </div>
  <div>
   <button ontouchstart="moveTouch('left',true)" ontouchend="moveTouch('left',false)">◀</button>
   <button ontouchstart="moveTouch('back',true)" ontouchend="moveTouch('back',false)">▼</button>
   <button ontouchstart="moveTouch('right',true)" ontouchend="moveTouch('right',false)">▶</button>
  </div>
 </div>
 <div id="lookInfo">Mobilde ekranın sağ tarafını sürükleyerek bakabilirsin.</div>
</div>

<div id="ending">
 <h1>SON GECE</h1>
 <h2>İLK BÖLÜM TAMAMLANDI</h2>
 <p>Malikanenin sırrı henüz çözülmedi...</p>
 <button onclick="location.reload()">YENİDEN OYNA</button>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
let scene,camera,renderer,clock;
let keys={};
let touch={forward:false,back:false,left:false,right:false};
let flashlight,door,keyObject;
let hasKey=false,doorOpen=false,playing=false;
let yaw=0,pitch=0;
let objects=[];
let lastTouchX=0,lastTouchY=0;

function startGame(){
 if(!window.THREE){
  alert("3D kütüphanesi yüklenemedi. İnternet bağlantısını kontrol et.");
  return;
 }

 document.getElementById("menu").style.display="none";
 document.getElementById("hud").classList.remove("hidden");
 document.getElementById("controls").style.display="block";

 init3D();
 playing=true;

 if(!isMobile()){
  renderer.domElement.requestPointerLock?.();
 }
}

function isMobile(){
 return /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
}

function init3D(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x050609);
 scene.fog=new THREE.FogExp2(0x08090d,0.045);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,100);
 camera.position.set(0,1.7,7);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 document.getElementById("game").prepend(renderer.domElement);

 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0x667080,0x171016,0.4));

 const ambient=new THREE.PointLight(0x7c3030,1.2,12);
 ambient.position.set(0,3,-8);
 scene.add(ambient);

 createRoom();
 createFlashlight();
 createKey();

 window.addEventListener("resize",resize);
 window.addEventListener("keydown",e=>keys[e.code]=true);
 window.addEventListener("keyup",e=>keys[e.code]=false);

 renderer.domElement.addEventListener("click",()=>{
  if(!isMobile() && playing && document.pointerLockElement!==renderer.domElement){
   renderer.domElement.requestPointerLock?.();
  }
 });

 document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement===renderer.domElement){
   yaw-=e.movementX*0.002;
   pitch-=e.movementY*0.002;
   pitch=Math.max(-1.2,Math.min(1.2,pitch));
  }
 });

 renderer.domElement.addEventListener("touchstart",e=>{
  if(e.touches[0].clientX>innerWidth*0.35){
   lastTouchX=e.touches[0].clientX;
   lastTouchY=e.touches[0].clientY;
  }
 },{passive:true});

 renderer.domElement.addEventListener("touchmove",e=>{
  if(e.touches[0].clientX>innerWidth*0.35){
   let dx=e.touches[0].clientX-lastTouchX;
   let dy=e.touches[0].clientY-lastTouchY;
   yaw-=dx*0.005;
   pitch-=dy*0.005;
   pitch=Math.max(-1.2,Math.min(1.2,pitch));
   lastTouchX=e.touches[0].clientX;
   lastTouchY=e.touches[0].clientY;
  }
 },{passive:true});

 animate();
}

function box(w,h,d,x,y,z,color){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color:color,roughness:0.95})
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 objects.push(mesh);
 return mesh;
}

function createRoom(){
 // Zemin
 box(18,0.3,35,0,-0.15,-8,0x282323);

 // Tavan
 box(18,0.3,35,0,4,-8,0x17171d);

 // Yan duvarlar
 box(0.4,4,35,-9,2,-8,0x27232a);
 box(0.4,4,35,9,2,-8,0x27232a);

 // Arka duvar
 box(18,4,0.4,0,2,-25,0x242127);

 // Koridorun ara duvarları
 box(0.3,4,8,-5,2,-12,0x332a2b);
 box(0.3,4,8,5,2,-12,0x332a2b);

 // Ahşap sütunlar
 for(let z=2;z>-23;z-=5){
  box(0.5,4,0.5,-7,2,z,0x49352b);
  box(0.5,4,0.5,7,2,z,0x49352b);
 }

 // Halı
 box(4,0.05,24,0,0.02,-9,0x35151b);

 // Eski masa
 box(2,0.2,1,3,1,-9,0x39251c);
 box(0.15,1,0.15,2.2,0.5,-9,0x241a16);
 box(0.15,1,0.15,3.8,0.5,-9,0x241a16);

 // Lambalar
 for(let z=3;z>-24;z-=7){
  const light=new THREE.PointLight(0x7e3333,1.1,8);
  light.position.set(0,3.6,z);
  scene.add(light);
 }
 
 // Bodrum kapısı
 door=new THREE.Mesh(
  new THREE.BoxGeometry(2.2,3,0.18),
  new THREE.MeshStandardMaterial({color:0x38231d})
 );
 door.position.set(0,1.5,-24.5);
 scene.add(door);
}

function createFlashlight(){
 flashlight=new THREE.SpotLight(0xffe5bb,35,22,Math.PI/7,0.4,1.5);
 flashlight.position.set(0,0,0);
 flashlight.target.position.set(0,0,-1);
 camera.add(flashlight);
 camera.add(flashlight.target);
 scene.add(camera);
}

function createKey(){
 keyObject=new THREE.Mesh(
  new THREE.TorusGeometry(0.22,0.06,8,18),
  new THREE.MeshStandardMaterial({
   color:0xd9ae40,metalness:0.8,roughness:0.3
  })
 );
 keyObject.position.set(3,1.25,-9);
 scene.add(keyObject);
}

function moveTouch(direction,value){
 touch[direction]=value;
}

function interact(){
 if(!playing)return;

 let distance=camera.position.distanceTo(keyObject.position);

 if(!hasKey && distance<2.5){
  hasKey=true;
  scene.remove(keyObject);
  document.getElementById("objective").innerText="GÖREV: Bodrum kapısını aç.";
  document.getElementById("hint").innerText="Paslı anahtarı buldun!";
  return;
 }

 let doorDistance=camera.position.distanceTo(door.position);

 if(hasKey && !doorOpen && doorDistance<3){
  doorOpen=true;
  door.rotation.y=Math.PI/2;
  document.getElementById("objective").innerText="GÖREV: Bodrumu keşfet.";
  document.getElementById("hint").innerText="Kapı açıldı!";
  return;
 }

 if(doorOpen && doorDistance<4){
  playing=false;
  document.exitPointerLock?.();
  document.getElementById("hud").classList.add("hidden");
  document.getElementById("ending").style.display="flex";
  return;
 }

 document.getElementById("hint").innerText="Burada etkileşime geçilecek bir şey yok.";
}

function animate(){
 requestAnimationFrame(animate);
 if(!playing)return;

 let dt=Math.min(clock.getDelta(),0.05);

 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 let speed=4*dt;
 let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 let right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));

 if(keys.KeyW||keys.ArrowUp||touch.forward)camera.position.addScaledVector(forward,speed);
 if(keys.KeyS||keys.ArrowDown||touch.back)camera.position.addScaledVector(forward,-speed);
 if(keys.KeyA||keys.ArrowLeft||touch.left)camera.position.addScaledVector(right,-speed);
 if(keys.KeyD||keys.ArrowRight||touch.right)camera.position.addScaledVector(right,speed);

 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-8,8);
 camera.position.z=THREE.MathUtils.clamp(camera.position.z,-24,7);

 flashlight.position.copy(camera.position);
 flashlight.target.position.copy(camera.position).add(forward);

 if(!hasKey){
  keyObject.rotation.y+=dt*1.5;
  keyObject.position.y=1.25+Math.sin(clock.elapsedTime*2)*0.1;
 }

 let keyDistance=hasKey?100:camera.position.distanceTo(keyObject.position);
 let doorDistance=camera.position.distanceTo(door.position);

 document.getElementById("interact").style.display=
  ((!hasKey&&keyDistance<2.5)||(hasKey&&!doorOpen&&doorDistance<3)||(doorOpen&&doorDistance<4))
  ?"block":"none";

 renderer.render(scene,camera);
}

function resize(){
 if(!camera)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
</script>
</body>
</html>
