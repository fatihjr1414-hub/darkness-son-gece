<head>

<title>DARKNESS: SON GECE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:white;font-family:Arial;overflow:hidden}
#game{width:100vw;height:100dvh;position:relative;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
#controls,#controls button{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#menu,#ending{
 position:absolute;inset:0;z-index:5;
 background:radial-gradient(circle,#25212a,#050508 75%);
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;
}
h1{font-size:clamp(38px,9vw,75px);letter-spacing:7px;color:#c21e2c;text-shadow:0 0 25px red}
h2{color:#c21e2c;letter-spacing:4px}
button{
 background:#76121c;color:white;border:1px solid #d33;
 padding:14px 22px;margin:6px;border-radius:5px;
 font-size:15px;cursor:pointer
}
button:active{background:#b22}
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
#objective{position:absolute;top:15px;left:15px;background:#0009;padding:12px;font-size:13px}
#hint{position:absolute;top:65px;left:15px;color:#ddd;font-size:13px}
#crosshair{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);font-size:22px;color:white
}
#interact{
 position:absolute;bottom:25px;right:25px;
 pointer-events:auto;display:none
}
#controls{
 position:absolute;bottom:20px;left:20px;
 display:none;pointer-events:auto
}
#controls button{width:55px;height:55px;padding:5px;background:#222b}
#lookInfo{
 position:absolute;bottom:12px;left:50%;
 transform:translateX(-50%);font-size:11px;color:#aaa;
 white-space:nowrap
}
#ending{display:none}
.hidden{display:none!important}
@media(orientation:landscape){
 #controls{bottom:15px;left:20px}
 #interact{bottom:20px;right:25px}
}
#scare{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:#090000;pointer-events:none;overflow:hidden}
#scare.active{display:flex;animation:scareFlash .16s steps(2,end) 5}
#scare img{width:100%;height:100%;object-fit:cover;filter:contrast(1.18) brightness(.82);animation:scareLunge 1.45s ease-out both}
@keyframes scareFlash{0%{background:#3d0000}50%{background:#000}}
@keyframes scareLunge{0%{transform:scale(.4) rotate(-8deg)}55%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1.05)}}
</style>
</head>

 <h1>SON GECE</h1>
 <h2>İLK BÖLÜM TAMAMLANDI</h2>
 <p>Malikanenin sırrı henüz çözülmedi...</p>
 <button onclick="location.reload()">YENİDEN OYNA</button>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
let scene,camera,renderer,clock;
let keys={};
let touch={forward:false,back:false,left:false,right:false};
let flashlight,door,keyObject;
let hasKey=false,doorOpen=false,playing=false;
let yaw=0,pitch=0;
let objects=[];
let colliders=[];
let lastTouchX=0,lastTouchY=0;
let scareTriggered=false,scareUntil=0,scareAudio=null;
let apparition=null,apparitionState="idle",apparitionTime=0,apparitionStart=null;
let ambientOsc=null,ambientGain=null,lastStepAt=0,soundOn=true;
let hideSpots=[],hiddenSpot=null,stormLight=null,stormTimer=3,flashTimer=0,roomLights=[],ambientRain=null;
let stormClock=0,creakTimer=7;

function startGame(){
 if(!window.THREE){
  alert("3D kütüphanesi yüklenemedi. İnternet bağlantısını kontrol et.");
  return;
 }

 document.getElementById("menu").style.display="none";
 document.getElementById("hud").classList.remove("hidden");
 document.getElementById("controls").style.display="block";

 init3D();
 playing=true;
 // Ses yalnızca oyuncu oyunu başlattığında hazırlanır.
 try{scareAudio=new (window.AudioContext||window.webkitAudioContext)(); startAmbient();}catch(e){}

 if(!isMobile()){
  renderer.domElement.requestPointerLock?.();
 }
}

function isMobile(){
 return /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
}

function init3D(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x050609);
 scene.fog=new THREE.FogExp2(0x08090d,0.045);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,100);
 camera.position.set(0,1.7,7);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 document.getElementById("game").prepend(renderer.domElement);

 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0x667080,0x171016,0.4));

 const ambient=new THREE.PointLight(0x7c3030,1.2,12);
 ambient.position.set(0,3,-8);
 scene.add(ambient);

 createRoom();
 createFlashlight();
 createKey();
 createApparition();
 stormLight=new THREE.DirectionalLight(0xb8d8ff,0);stormLight.position.set(4,8,-12);scene.add(stormLight);

 window.addEventListener("resize",resize);
 window.addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="KeyE"&&!e.repeat)interact();if(e.code==="KeyF"&&!e.repeat)toggleHide();});
 window.addEventListener("keyup",e=>keys[e.code]=false);

 renderer.domElement.addEventListener("click",()=>{
  if(!isMobile() && playing && document.pointerLockElement!==renderer.domElement){
   renderer.domElement.requestPointerLock?.();
  }
 });

 document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement===renderer.domElement){
   yaw-=e.movementX*0.002;
   pitch-=e.movementY*0.002;
   pitch=Math.max(-1.2,Math.min(1.2,pitch));
  }
 });

 // Her parmak ayrı izlenir: sol başparmak hareket, sağ başparmak kamera.
 let lookFingerId=null;
 renderer.domElement.addEventListener("touchstart",e=>{
  e.preventDefault();
  if(lookFingerId!==null)return;
  for(const finger of e.changedTouches){
   if(finger.clientX>innerWidth*0.35){
    lookFingerId=finger.identifier;
    lastTouchX=finger.clientX;
    lastTouchY=finger.clientY;
    break;
   }
  }
 },{passive:false});
 renderer.domElement.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(lookFingerId===null)return;
  for(const finger of e.changedTouches){
   if(finger.identifier!==lookFingerId)continue;
   const dx=finger.clientX-lastTouchX;
   const dy=finger.clientY-lastTouchY;
   yaw-=dx*0.005;
   pitch-=dy*0.005;
   pitch=Math.max(-1.2,Math.min(1.2,pitch));
   lastTouchX=finger.clientX;
   lastTouchY=finger.clientY;
   break;
  }
 },{passive:false});
 function releaseLookFinger(e){
  for(const finger of e.changedTouches){
   if(finger.identifier===lookFingerId){lookFingerId=null;break;}
  }
 }
 renderer.domElement.addEventListener("touchend",releaseLookFinger,{passive:true});
 renderer.domElement.addEventListener("touchcancel",releaseLookFinger,{passive:true});

 // Butonların dokunmayı tarayıcıya kaydırma/zoom olarak iletmesini önle.
 document.querySelectorAll("#controls button").forEach(button=>{
  button.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
  button.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
  button.addEventListener("touchcancel",()=>{
   Object.keys(touch).forEach(k=>touch[k]=false);
  });
 });

 animate();
}

}

function thunder(){
 if(!scareAudio||!soundOn)return;
 try{
  const ctx=scareAudio,t=ctx.currentTime,duration=2.3;
  const buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*duration),ctx.sampleRate);
  const data=buffer.getChannelData(0);let last=0;
  for(let i=0;i<data.length;i++){last=(last*.985)+(Math.random()*2-1)*.015;data[i]=last;}
  const src=ctx.createBufferSource(),low=ctx.createBiquadFilter(),gain=ctx.createGain();
  src.buffer=buffer;low.type='lowpass';low.frequency.value=210;
  gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.22,t+.15);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
  src.connect(low);low.connect(gain);gain.connect(ctx.destination);src.start(t);
 }catch(e){}
}

// Web Audio ile özgün, harici dosya gerektirmeyen sesler.
function startAmbient(){
 if(!scareAudio)return;
 scareAudio.resume().catch(()=>{});
 ambientOsc=scareAudio.createOscillator();ambientGain=scareAudio.createGain();
 ambientOsc.type='sine';ambientOsc.frequency.value=55;
 ambientGain.gain.value=soundOn?0.018:0;
 ambientOsc.connect(ambientGain);ambientGain.connect(scareAudio.destination);
 ambientOsc.start();
}
function playTone(freq,duration,volume,type='sine'){
 if(!scareAudio||!soundOn)return;
 try{
  const t=scareAudio.currentTime,o=scareAudio.createOscillator(),g=scareAudio.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(volume,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+duration);
  o.connect(g);g.connect(scareAudio.destination);o.start(t);o.stop(t+duration+0.02);
 }catch(e){}
}
function toggleSound(){
 soundOn=!soundOn;
 if(ambientGain&&scareAudio)ambientGain.gain.setTargetAtTime(soundOn?0.018:0,scareAudio.currentTime,0.08);
 document.getElementById('soundToggle').textContent=soundOn?'🔊 SES AÇIK':'🔇 SES KAPALI';
}
function playJumpscareScream(){
 if(!scareAudio||!soundOn)return;
 try{
  if(scareAudio.state==='suspended')scareAudio.resume();
  const ctx=scareAudio,t=ctx.currentTime,duration=1.45;
  // Sentetik çığlık: tiz, titreşimli tonlar + kısa gürültü patlaması.
  const master=ctx.createGain();
  master.gain.setValueAtTime(0.0001,t);
  master.gain.exponentialRampToValueAtTime(0.23,t+0.045);
  master.gain.setValueAtTime(0.20,t+0.36);
  master.gain.exponentialRampToValueAtTime(0.0001,t+duration);
  master.connect(ctx.destination);
  for(const [base,level] of [[420,0.55],[730,0.32],[1120,0.18]]){
   const osc=ctx.createOscillator(),g=ctx.createGain();
   osc.type='sawtooth';
   osc.frequency.setValueAtTime(base*1.3,t);
   osc.frequency.exponentialRampToValueAtTime(base*0.55,t+duration);
   const vibrato=ctx.createOscillator(),depth=ctx.createGain();
   vibrato.frequency.value=19;depth.gain.value=base*0.045;
   vibrato.connect(depth);depth.connect(osc.frequency);
   g.gain.value=level;osc.connect(g);g.connect(master);
   osc.start(t);vibrato.start(t);osc.stop(t+duration);vibrato.stop(t+duration);
  }
  const sampleRate=ctx.sampleRate,length=Math.floor(sampleRate*0.65);
  const buffer=ctx.createBuffer(1,length,sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
  const noise=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),noiseGain=ctx.createGain();
  noise.buffer=buffer;filter.type='highpass';filter.frequency.value=600;
  noiseGain.gain.value=0.55;noise.connect(filter);filter.connect(noiseGain);noiseGain.connect(master);
  noise.start(t);noise.stop(t+0.65);
 }catch(e){console.warn('Jumpscare ses hatası:',e);}
}

function updateApparition(dt){
 if(!apparition||scareTriggered)return;
 if(apparitionState==='idle' && camera.position.z < -1.8){
  apparitionState='running';apparitionTime=0;
  apparition.group.visible=true;
  apparition.group.position.set(camera.position.x,0,Math.min(camera.position.z-13,-16));
  apparitionStart=apparition.group.position.clone();
  document.getElementById('hint').innerText='ARKANDA BİR ŞEY VAR... KOŞ!';
 }
 if(apparitionState!=='running')return;
 if(hiddenSpot){
  // Hayalet oyuncunun saklandığını görmediyse peşini bırakır.
  apparition.group.visible=false;apparitionState='done';
  document.getElementById('hint').textContent='Ayak sesleri uzaklaşıyor...';return;
 }
 apparitionTime+=dt;
 const ghost=apparition.group;
 const toward=new THREE.Vector3(camera.position.x-ghost.position.x,0,camera.position.z-ghost.position.z);
 const distance=toward.length();
 toward.normalize();
 ghost.position.addScaledVector(toward,Math.min(distance,6.7*dt+apparitionTime*.06));
 ghost.rotation.y=Math.atan2(toward.x,toward.z);
 const phase=apparitionTime*17;
 apparition.arms[0].rotation.x=Math.sin(phase)*.95-.45;
 apparition.arms[1].rotation.x=-Math.sin(phase)*.95-.45;
 apparition.legs[0].rotation.x=-Math.sin(phase)*.85;
 apparition.legs[1].rotation.x=Math.sin(phase)*.85;
 ghost.position.y=Math.abs(Math.sin(phase))*.11;
 apparition.dress.rotation.z=Math.sin(phase*.5)*.07;
 if(distance<1.55){ghost.visible=false;apparitionState='done';triggerScare();}
}

function triggerScare(){
 if(scareTriggered)return;
 scareTriggered=true;
 scareUntil=performance.now()+1500;
 document.getElementById('scare').classList.add('active');
 playJumpscareScream();
}

function animate(){
 requestAnimationFrame(animate);
 if(!playing)return;

 let dt=Math.min(clock.getDelta(),0.05);
 if(scareTriggered && scareUntil && performance.now()>scareUntil){
  document.getElementById('scare').classList.remove('active');
  scareUntil=0;
 }
 // Jumpscare artık hayalet oyuncuya ulaştığında tetikleniyor.

 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 updateStorm(dt);
 let speed=hiddenSpot?0:4*dt;
 let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 let right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));

 // Oyuncu yarıçapı ile duvar ve sütunlara karşı eksen bazlı çarpışma.
 let direction=new THREE.Vector3();
 if(keys.KeyW||keys.ArrowUp||touch.forward)direction.add(forward);
 if(keys.KeyS||keys.ArrowDown||touch.back)direction.sub(forward);
 if(keys.KeyA||keys.ArrowLeft||touch.left)direction.sub(right);
 if(keys.KeyD||keys.ArrowRight||touch.right)direction.add(right);
 if(direction.lengthSq()>0)direction.normalize().multiplyScalar(speed);
 const radius=0.32;
 function canStand(x,z){
  if(x < -19+radius || x > 19-radius || z < -24.8+radius || z > 9.3-radius)return false;
  for(const wall of colliders){
   if(Math.abs(x-wall.x)<wall.halfW+radius && Math.abs(z-wall.z)<wall.halfD+radius)return false;
  }
  // Bodrum kapısı açılana kadar kapalıdır.
  if(!doorOpen && Math.abs(x-door.position.x)<1.1+radius && Math.abs(z-door.position.z)<0.09+radius)return false;
  return true;
 }
 const nextX=camera.position.x+direction.x;
 if(canStand(nextX,camera.position.z))camera.position.x=nextX;
 const nextZ=camera.position.z+direction.z;
 if(canStand(camera.position.x,nextZ))camera.position.z=nextZ;
 const moving=!hiddenSpot && (keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight||touch.forward||touch.back||touch.left||touch.right);
 if(moving && performance.now()-lastStepAt>460){
  lastStepAt=performance.now();playTone(65+Math.random()*18,0.11,0.035,'triangle');
 }

 updateApparition(dt);

 // Işık ve hedef kameraya bağlı: yerel koordinatları değiştirmiyoruz.

 if(!hasKey){
  keyObject.rotation.y+=dt*1.5;
  keyObject.position.y=1.25+Math.sin(clock.elapsedTime*2)*0.1;
 }

 let keyDistance=hasKey?100:camera.position.distanceTo(keyObject.position);
 let doorDistance=camera.position.distanceTo(door.position);

 const hideButton=document.getElementById('hideButton');
 hideButton.style.display=(hiddenSpot||nearestHideSpot())?'block':'none';
 hideButton.textContent=hiddenSpot?'SAKLANDIĞIN YERDEN ÇIK':'SAKLAN';
 document.getElementById("interact").style.display=
  ((!hasKey&&keyDistance<2.5)||(hasKey&&!doorOpen&&doorDistance<3)||(doorOpen&&doorDistance<4))
  ?"block":"none";

 renderer.render(scene,camera);
}

function resize(){
 if(!camera)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
</script>
</body>
</html>
